services:
  # ── BACKEND WEB SERVICE ──────────────────────────────────────────
  - type: web
    name: certificate-validator-backend
    env: node
    region: singapore
    buildCommand: npm --prefix backend install
    startCommand: npm --prefix backend start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://certificate-validator-yvak.onrender.com
      - key: JWT_SECRET
        generateValue: true

  # ── FRONTEND STATIC SITE ─────────────────────────────────────────
  - type: web
    name: certificate-validator-frontend
    env: static
    region: singapore
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set in Render Dashboard to your backend URL (e.g. https://certificate-validator-backend.onrender.com)
    routes:
      # SPA Rewrite Rule — Redirects all routes (/student, /verify, /university, etc.) to index.html to fix 404 on refresh
      - type: rewrite
        source: /*
        destination: /index.html
